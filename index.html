<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Yasir Jafri, Senior Software Engineer: backend and distributed systems">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230d1117%27/%3E%3Ctext x=%274%27 y=%2722%27 font-family=%27monospace%27 font-size=%2716%27 font-weight=%27bold%27 fill=%27%237ee787%27%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css?v=a502c326">
  <script>
    // Pick mode before first paint to avoid a flash of the wrong view.
    (function () {
      var mode = location.hash === "#simple" ? "simple" : location.hash === "#terminal" ? "terminal" : null;
      if (!mode) { try { mode = localStorage.getItem("mode"); } catch (e) {} }
      document.documentElement.dataset.mode = mode === "simple" ? "simple" : "terminal";
    })();
  </script>
</head>
<body>
  <main id="terminal" class="terminal">
    <header id="hero" class="hero"></header>

    <div id="term-window" class="term-window">
      <div class="term-bar">
        <button type="button" class="dot dot-close" data-action="close" aria-label="Close terminal and show the simple page" title="Close terminal (show simple page)"><span aria-hidden="true">×</span></button>
        <button type="button" class="dot dot-min" data-action="minimize" aria-label="Minimize terminal" title="Minimize"><span aria-hidden="true">−</span></button>
        <button type="button" class="dot dot-max" data-action="maximize" aria-label="Maximize terminal" title="Maximize"><span aria-hidden="true">+</span></button>
        <span class="term-title"></span>
      </div>
      <div id="term-body" class="term-body">
        <div id="term-output" class="term-output" role="log" aria-live="polite"></div>
        <form id="term-form" class="term-line" autocomplete="off">
          <label for="term-input" class="prompt"></label>
          <input id="term-input" class="term-input" type="text" spellcheck="false" autocapitalize="off" aria-label="Terminal command">
        </form>
      </div>
    </div>

    <p class="hint">
      Not a terminal person? Click
      <button type="button" class="dot dot-close dot-inline" data-action="close" aria-label="Close terminal and show the simple page"><span aria-hidden="true">×</span></button>
      to close it and see a simple page.
    </p>
    <nav class="quick" aria-label="Quick commands"></nav>
    <footer id="term-footer" class="term-footer"></footer>
  </main>

  <main id="simple" class="simple" aria-label="Portfolio"></main>

  <script src="data.js?v=1318eb38"></script>
  <script src="app.js?v=ab05cd67"></script>
</body>
</html>
